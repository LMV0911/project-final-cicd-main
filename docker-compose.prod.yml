version: "3.8"

services:
  mongodb:
    image: mongo:4.4.18
    volumes:
      - mongodb_data_prod:/data/db
    networks:
      - ecommerce_net
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok' || mongo --quiet --eval 'db.adminCommand(\"ping\").ok'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M

  auth-service:
    image: ${CI_REGISTRY_IMAGE:-registry.gitlab.com/group/project}/auth-service:${IMAGE_TAG:-latest}
    networks:
      - ecommerce_net
    secrets:
      - jwt_secret
    environment:
      - APP_ENV=production
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/auth
      - JWT_SECRET=/run/secrets/jwt_secret
      - CORS_ORIGIN=${CORS_ORIGIN:-https://shop.example.com}
    deploy:
      replicas: 2
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
        failure_action: rollback
        monitor: 15s
        max_failure_ratio: 0.2
      rollback_config:
        parallelism: 1
        delay: 5s
        order: stop-first
        monitor: 10s
      restart_policy:
        condition: on-failure
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
        reservations:
          cpus: '0.10'
          memory: 64M

  product-service:
    image: ${CI_REGISTRY_IMAGE:-registry.gitlab.com/group/project}/product-service:${IMAGE_TAG:-latest}
    networks:
      - ecommerce_net
    environment:
      - APP_ENV=production
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/products
      - CORS_ORIGIN=${CORS_ORIGIN:-https://shop.example.com}
    deploy:
      replicas: 2
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
        failure_action: rollback
        monitor: 15s
        max_failure_ratio: 0.2
      rollback_config:
        parallelism: 1
        delay: 5s
        order: stop-first
        monitor: 10s
      restart_policy:
        condition: on-failure
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
        reservations:
          cpus: '0.10'
          memory: 64M

  order-service:
    image: ${CI_REGISTRY_IMAGE:-registry.gitlab.com/group/project}/order-service:${IMAGE_TAG:-latest}
    networks:
      - ecommerce_net
    secrets:
      - jwt_secret
    environment:
      - APP_ENV=production
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/orders
      - PRODUCT_SERVICE_URL=http://product-service:3000
      - JWT_SECRET=/run/secrets/jwt_secret
      - CORS_ORIGIN=${CORS_ORIGIN:-https://shop.example.com}
    deploy:
      replicas: 2
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
        failure_action: rollback
        monitor: 15s
        max_failure_ratio: 0.2
      rollback_config:
        parallelism: 1
        delay: 5s
        order: stop-first
        monitor: 10s
      restart_policy:
        condition: on-failure
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
        reservations:
          cpus: '0.10'
          memory: 64M

  frontend:
    image: ${CI_REGISTRY_IMAGE:-registry.gitlab.com/group/project}/frontend:${IMAGE_TAG:-latest}
    networks:
      - ecommerce_net
    ports:
      - "8080:8080"
    environment:
      - APP_ENV=production
      - NODE_ENV=production
      - AUTH_SERVICE_URL=http://auth-service:3001
      - PRODUCT_SERVICE_URL=http://product-service:3000
      - ORDER_SERVICE_URL=http://order-service:3002
      - PORT=8080
    deploy:
      replicas: 3
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
        failure_action: rollback
        monitor: 15s
        max_failure_ratio: 0.2
      rollback_config:
        parallelism: 1
        delay: 5s
        order: stop-first
        monitor: 10s
      restart_policy:
        condition: on-failure
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
        reservations:
          cpus: '0.10'
          memory: 64M

volumes:
  mongodb_data_prod:

networks:
  ecommerce_net:
    driver: overlay

secrets:
  jwt_secret:
    external: true
