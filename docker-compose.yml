version: "3.8"

services:
  mongodb:
    image: mongo:4.4.18
    container_name: mongodb
    restart: unless-stopped
    volumes:
      - mongodb_data:/data/db
    networks:
      - ecommerce-net
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok' || mongo --quiet --eval 'db.adminCommand(\"ping\").ok'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  auth-service:
    build:
      context: ./services/auth-service
      target: development
    container_name: auth-service
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - APP_ENV=development
      - NODE_ENV=development
      - MONGODB_URI=${AUTH_MONGODB_URI:-mongodb://mongodb:27017/auth}
      - JWT_SECRET=${JWT_SECRET:-dev_jwt_secret_change_me}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:8080}
    volumes:
      - ./services/auth-service:/app
      - /app/node_modules
    networks:
      - ecommerce-net
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:3001/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  product-service:
    build:
      context: ./services/product-service
      target: development
    container_name: product-service
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - APP_ENV=development
      - NODE_ENV=development
      - MONGODB_URI=${PRODUCT_MONGODB_URI:-mongodb://mongodb:27017/products}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:8080}
    volumes:
      - ./services/product-service:/app
      - /app/node_modules
    networks:
      - ecommerce-net
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  order-service:
    build:
      context: ./services/order-service
      target: development
    container_name: order-service
    restart: unless-stopped
    ports:
      - "3002:3002"
    environment:
      - APP_ENV=development
      - NODE_ENV=development
      - MONGODB_URI=${ORDER_MONGODB_URI:-mongodb://mongodb:27017/orders}
      - PRODUCT_SERVICE_URL=${PRODUCT_SERVICE_URL:-http://product-service:3000}
      - JWT_SECRET=${JWT_SECRET:-dev_jwt_secret_change_me}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:8080}
    volumes:
      - ./services/order-service:/app
      - /app/node_modules
    networks:
      - ecommerce-net
    depends_on:
      mongodb:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      product-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:3002/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      target: development
    container_name: frontend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - APP_ENV=development
      - NODE_ENV=development
      - AUTH_SERVICE_URL=${AUTH_SERVICE_URL:-http://auth-service:3001}
      - PRODUCT_SERVICE_URL=${PRODUCT_SERVICE_URL:-http://product-service:3000}
      - ORDER_SERVICE_URL=${ORDER_SERVICE_URL:-http://order-service:3002}
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - ecommerce-net
    depends_on:
      auth-service:
        condition: service_healthy
      product-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8080/health || wget --spider -q http://localhost:8080/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  mongodb_data:

networks:
  ecommerce-net:
    driver: bridge
