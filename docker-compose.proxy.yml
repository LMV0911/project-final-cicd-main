version: "3.8"

services:
  reverse-proxy:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./proxy/entrypoint.sh:/docker-entrypoint.d/99-gen-certs.sh:ro
      - certs_data:/etc/nginx/certs
    networks:
      - ecommerce_net
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager

volumes:
  certs_data:

networks:
  ecommerce_net:
    name: e-commerce_ecommerce_net
    external: true
